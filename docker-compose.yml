services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: techbrief
      POSTGRES_USER: techbrief
      POSTGRES_PASSWORD: techbrief
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techbrief -d techbrief"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${HOST_REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["web"]
    ports:
      - "${HOST_APP_PORT:-8010}:8010"
    environment:
      TECHBRIEF_SERVICE: web
      DJANGO_SETTINGS_MODULE: techbrief.settings.local
      DATABASE_URL: postgres://techbrief:techbrief@postgres:5432/techbrief
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/live/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    environment:
      TECHBRIEF_SERVICE: worker
      DJANGO_SETTINGS_MODULE: techbrief.settings.local
      DATABASE_URL: postgres://techbrief:techbrief@postgres:5432/techbrief
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["beat"]
    environment:
      TECHBRIEF_SERVICE: beat
      DJANGO_SETTINGS_MODULE: techbrief.settings.local
      DATABASE_URL: postgres://techbrief:techbrief@postgres:5432/techbrief
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
