apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: techbrief-web-hpa
  namespace: techbrief
  labels:
    app.kubernetes.io/name: techbrief
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: techbrief-web
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
