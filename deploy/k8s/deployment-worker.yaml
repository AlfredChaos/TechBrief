apiVersion: apps/v1
kind: Deployment
metadata:
  name: techbrief-worker
  namespace: techbrief
  labels:
    app.kubernetes.io/name: techbrief
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: techbrief
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: techbrief
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: techbrief-app:latest
          command: ["scripts/docker-entrypoint.sh", "worker"]
          env:
            - name: TECHBRIEF_SERVICE
              value: "worker"
          envFrom:
            - configMapRef:
                name: techbrief-config
            - secretRef:
                name: techbrief-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
